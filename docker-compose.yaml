# VectorStep evaluation/production-lite stack, pulled from published images.
#
# This file is fetched into ~/.vectorstep by install.sh; you can also drive it
# directly with `docker compose` from that directory. Unlike the compose file
# in the (private) source repo, there are no `build:` blocks here — everything
# comes from ghcr.io.
#
# Image tag comes from VECTORSTEP_IMAGE_TAG in .env; `latest` tracks the most
# recent release, `edge` tracks the default branch. Deliberately NOT named
# VECTORSTEP_VERSION: that name is the app's own self-reported version,
# baked into the image at build time (see service/src/main.py). Every var in
# .env is forwarded into the container below (env_file:), so reusing the
# same name here used to silently clobber the real build-time version with
# whatever tag this file happened to select — every non-pinned install
# reported "latest" instead of its real version, including in telemetry.

services:
  vectorstep:
    image: ghcr.io/bantex01/vectorstep:${VECTORSTEP_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Loopback by default — the quick start on a laptop should not expose an
    # unauthenticated-by-default service to the local network (see
    # SPEC-tls-and-network.md §3.6). Set VECTORSTEP_BIND=0.0.0.0 in .env to
    # serve other machines, and only behind TLS (server.tls in
    # config/vectorstep.yaml, or a terminating reverse proxy).
    ports: ["${VECTORSTEP_BIND:-127.0.0.1}:${VECTORSTEP_PORT:-8000}:8000"]
    # Every var in .env reaches the container this way, so a new ${VAR}
    # referenced from config/vectorstep.yaml (a notification channel's
    # token, a step's API key) never needs a compose-file edit — just add
    # it to .env. The explicit entries below are the ones the installer
    # itself depends on, kept visible rather than relying on env_file alone.
    env_file: .env
    environment:
      CONFIG_PATH: /etc/vectorstep/config.yaml
      VECTORSTEP_GATEWAY_TOKEN: ${VECTORSTEP_GATEWAY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./config/vectorstep.yaml:/etc/vectorstep/config.yaml:ro
      # Read-only, like config.yaml itself — security.shell_steps scripts are
      # host/operator-managed only, never editable through the pipeline-write
      # API, so the mount enforces that structurally on top of the per-call
      # checksum re-verification.
      - ./scripts:/etc/vectorstep/scripts:ro
      # Authoring directories live on the host so you can edit pipelines and
      # steps with a normal editor. Everything else the service writes — the
      # database, artifacts, logs — stays in the named volume.
      - ./pipelines:/data/pipelines
      - ./steps:/data/steps
      - vectorstep-data:/data

  gateway:
    image: ghcr.io/bantex01/vectorstep-gateway:${VECTORSTEP_IMAGE_TAG:-latest}
    profiles: [gateway]
    restart: unless-stopped
    # No host port. The vectorstep service reaches it on the compose network
    # at ws://gateway:18780 — publish one only if you need external access
    # (e.g. the Gateway MCP running on the host), and then put it behind TLS
    # and a firewall: the Gateway's admin token can rewrite agent definitions.
    # See SPEC-tls-and-network.md §3.6 and this repo's README, "Reaching
    # the Gateway from the host", if you need host access.
    expose: ["18780"]
    # See the vectorstep service's env_file comment above — the same reasoning
    # applies here for mcp_servers' ${VAR} placeholders and provider keys.
    env_file: .env
    environment:
      VECTORSTEP_GATEWAY_CONFIG: /etc/vectorstep-gateway/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./config/gateway.yaml:/etc/vectorstep-gateway/config.yaml:ro
      # Agent and skill definitions are authored on the host, same reasoning
      # as above. The Gateway's identity and token stay in the named volume,
      # so they survive a recreate.
      - ./agents:/data/agents
      - ./skills:/data/skills
      - gateway-data:/data

  # Enabled by `install.sh --postgres`, or by hand with
  # `docker compose --profile postgres up -d` plus a database.url change in
  # config/vectorstep.yaml. Not published on a host port — the service reaches
  # it over the compose network only.
  postgres:
    image: postgres:16
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: vectorstep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectorstep}
      POSTGRES_DB: vectorstep
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorstep -d vectorstep"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vectorstep-data: {}
  gateway-data: {}
  pg-data: {}
