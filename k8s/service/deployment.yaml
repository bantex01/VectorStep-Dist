# replicas: 1 is required today, regardless of database backend — the
# scheduler (APScheduler) is in-process and the event/dedup state is
# in-memory. A second replica would double-fire scheduled pipelines and
# desync dedup windows. strategy: Recreate (rather than the apps/v1 default
# RollingUpdate) ensures the old pod fully terminates before the new one
# starts, so there is never a moment with two pods live — see
# configmap.example.yaml's database.auto_migrate comment for why that also
# makes in-process Alembic migration safe with no init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectorstep
  labels:
    app: vectorstep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vectorstep
  template:
    metadata:
      labels:
        app: vectorstep
    spec:
      # fsGroup matters because the PVC below must arrive group-writable for the
      # non-root process to use it — without it most storage classes mount the
      # volume root-owned and the container crashes on first write. The uid/gid
      # match the image's `useradd -u 1000` (service/Dockerfile) — if that ever
      # changes, this manifest breaks with it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # A freshly provisioned PVC is genuinely empty — unlike a Docker named
      # volume, which gets the image's existing /data content copied in on
      # first use, Kubernetes has no equivalent behaviour. Without this, the
      # main container crash-loops on first boot: database.url's sqlite file
      # now creates its own parent directory (src/db/database.py), but
      # pipeline_config_dir/step_library_dir intentionally still fail loudly
      # on a missing directory (it's the only signal that catches a typo'd
      # path there), so the directories have to actually exist first. Mirrors
      # the same mkdir -p list service/Dockerfile bakes into the image, which
      # this PVC mount hides. Found and fixed while verifying this manifest
      # against a real cluster (SPEC-k8s-hardening.md).
      initContainers:
        - name: init-data-dirs
          image: ghcr.io/bantex01/vectorstep:latest
          command: ["sh", "-c", "mkdir -p /data/db /data/artifacts /data/logs /data/pipelines /data/steps"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: vectorstep
          # Pin to a specific released tag in production (see https://vectorstep.io/docs/about/status-and-support/#versions-and-releases);
          # :edge tracks the default branch, :latest tracks the most recent release.
          image: ghcr.io/bantex01/vectorstep:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Starting values — tune for your workload, don't take these as
          # authoritative. CPU is capped safely because this process is
          # I/O-bound waiting on LLM calls, not compute-bound.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - containerPort: 8000
          env:
            # Overrides the image's default (VECTORSTEP_INSTALL_METHOD=container,
            # baked into the Dockerfile for the plain docker-compose path) — see
            # SPEC-startup-telemetry.md §2. VECTORSTEP_TELEMETRY_STATE_DIR needs no
            # override here: the image default (/data) already matches the volume
            # mount below.
            - name: VECTORSTEP_INSTALL_METHOD
              value: k8s
          envFrom:
            # kubectl create secret generic vectorstep-secrets \
            #   --from-literal=VECTORSTEP_GATEWAY_TOKEN=... \
            #   --from-literal=VECTORSTEP_ADMIN_TOKEN=... \
            #   --from-literal=VECTORSTEP_WEBHOOK_TOKEN=...
            # Feeds the ${VAR} placeholders in configmap.example.yaml — no secret
            # values are ever baked into the ConfigMap or the image.
            - secretRef:
                name: vectorstep-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/vectorstep
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # Uncomment together with configmap.example.yaml's commented
            # server.tls block and the "tls" volume below:
            # - name: tls
            #   mountPath: /etc/vectorstep/tls
            #   readOnly: true
            # Uncomment to manage pipelines/steps as versioned ConfigMaps instead of
            # PVC-resident files (mutually exclusive with editing them via the UI/API,
            # which writes to /data/pipelines and /data/steps on the PVC):
            # - name: pipelines
            #   mountPath: /data/pipelines
            #   readOnly: true
            # - name: steps
            #   mountPath: /data/steps
            #   readOnly: true
            # Uncomment to deliver security.shell_steps.allowed scripts (only needed
            # if you enable shell steps — see configmap.example.yaml). Read-only and
            # separate from the pipelines/steps mounts above on purpose: scripts are
            # host/operator-managed only, never reachable through the pipeline-write
            # API's /data/pipelines, /data/steps.
            # - name: scripts
            #   mountPath: /etc/vectorstep/scripts
            #   readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: vectorstep-config   # from configmap.example.yaml — copy, edit, apply first
        - name: data
          persistentVolumeClaim:
            claimName: vectorstep-data
        - name: tmp
          emptyDir: {}
        # - name: tls
        #   secret:
        #     secretName: vectorstep-tls   # kubectl create secret tls vectorstep-tls --cert=... --key=...
        #   # Also switch the two httpGet probes above to scheme: HTTPS once this is live —
        #   # they default to HTTP and TLS termination makes plain :8000 stop answering.
        # - name: pipelines
        #   configMap:
        #     name: vectorstep-pipelines   # kubectl create configmap vectorstep-pipelines --from-file=./pipelines/
        # - name: steps
        #   configMap:
        #     name: vectorstep-steps       # kubectl create configmap vectorstep-steps --from-file=./steps/
        # - name: scripts
        #   configMap:
        #     name: vectorstep-shell-scripts   # kubectl create configmap vectorstep-shell-scripts --from-file=./scripts/
