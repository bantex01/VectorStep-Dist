# EXAMPLE — copy, edit, and apply as your own ConfigMap (or generate one from
# your real config with `kubectl create configmap vectorstep-config
# --from-file=config.yaml=./my-config.yaml`). Do not apply this file verbatim.
#
# This is the same "container paths" config described in
# https://vectorstep.io/docs/operations/deployment/ — everything writable lives under /data,
# which the Deployment mounts from the PVC in pvc.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorstep-config
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8000
      # tls:
      #   cert: /etc/vectorstep/tls/server.crt
      #   key: /etc/vectorstep/tls/server.key
      #   # key_password: ${VS_TLS_KEY_PASSWORD}
      #   # client_ca: /etc/vectorstep/tls/ca.crt   # presence enables mTLS
      # Mount path above matches the commented "tls" secret volume in
      # deployment.yaml. Most enterprises terminate the browser edge at an
      # Ingress instead (see ingress.example.yaml) and leave this block unset
      # — use it for a hop that isn't behind that Ingress, e.g. a direct
      # service-to-service caller outside a NetworkPolicy-protected namespace.

    database:
      url: sqlite+aiosqlite:////data/db/runs.db   # four slashes = absolute path
      # auto_migrate: true is the default (see below) — omit this key to keep it.
      # Migrations run in-process at boot via create_tables(). With replicas: 1
      # and strategy: Recreate (both set in deployment.yaml) that is safe and
      # needs no init container: the old pod is fully torn down before the new
      # one starts, so there is never a version-mismatched pod running against
      # a mid-migration schema.
      #
      # For a DBA-controlled cluster where migrations should be a reviewed,
      # separate step: set `auto_migrate: false` here, then run migrations
      # explicitly before rolling a new image —
      #   kubectl exec deploy/vectorstep -- alembic upgrade head
      # (or a one-shot Job running the same command) — then roll the
      # Deployment. That's exactly what auto_migrate exists for.

    pipeline_config_dir: /data/pipelines   # see the commented ConfigMap-mount alternative
    step_library_dir: /data/steps          # in deployment.yaml if you'd rather manage these
                                            # as versioned ConfigMaps than PVC-resident files.

    artifacts:
      dir: /data/artifacts

    logging:
      dir: /data/logs

    executors:
      gateway:
        # In-cluster service-to-service traffic inside a NetworkPolicy-protected
        # namespace is a defensible place to leave this as ws:// — that's why
        # it's the working default here. Once the Gateway terminates TLS (see
        # gateway/configmap.example.yaml's commented tls: block), switch both
        # this and rest_url below, and add tls.ca if it's a private CA:
        # url: wss://vectorstep-gateway:18780/rpc
        # tls:
        #   ca: /etc/vectorstep/tls/ca.crt
        url: ws://vectorstep-gateway:18780/rpc   # Gateway's in-cluster Service name:port
        token: ${VECTORSTEP_GATEWAY_TOKEN}       # from the Secret via envFrom — see README.md
        rest_url: http://vectorstep-gateway:18780
        # rest_url: https://vectorstep-gateway:18780   # matches the wss:// choice above

    # Required — VectorStep refuses to start without at least one token here
    # (or auth.allow_unauthenticated: true, not recommended beyond a throwaway
    # eval namespace). Both values come from vectorstep-secrets via envFrom —
    # see README.md. admin logs into the UI and calls /reload and most read
    # endpoints; webhook is scoped to POST /webhook only.
    auth:
      tokens:
        - name: admin
          token: ${VECTORSTEP_ADMIN_TOKEN}
          role: admin
        - name: webhook
          token: ${VECTORSTEP_WEBHOOK_TOKEN}
          role: webhook

    security:
      # A pipeline author gets a shell on this host if this is true — see
      # https://vectorstep.io/docs/reference/config/ before enabling it.
      allow_shell_checks: false   # default: false
      template_sandbox: true      # default: true
      # executor: shell pipeline steps — see https://vectorstep.io/docs/reference/config/
      # before enabling. scripts_dir must be delivered as its own read-only
      # ConfigMap volume (see the commented "scripts" volume/volumeMount in
      # deployment.yaml, same pattern as the pipelines/steps examples there)
      # — never the PVC-resident /data tree, since shell_steps.allowed is
      # host/operator-managed and must not be reachable through the
      # pipeline-write API's /data/pipelines, /data/steps mounts.
      shell_steps:
        enabled: false             # default: false
        scripts_dir: /etc/vectorstep/scripts
        allowed: []
