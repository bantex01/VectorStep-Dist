# EXAMPLE — copy, edit, and apply. Do not apply this file verbatim.
#
# WARNING: this exposes the Gateway's HTTP API outside the cluster, including
# the admin-token-protected write endpoints that can rewrite agent definitions.
# Only do this if CI genuinely cannot run inside the cluster, and then:
#   - terminate TLS (below), never plain HTTP
#   - restrict the source to your CI runners' egress addresses (annotation below)
#   - keep the admin token in a masked, protected CI variable
# Safer alternatives that need no Ingress at all: run the CI job on a runner
# inside the cluster and use the in-cluster Service URL, or use route B/C
# (kubectl-based — nothing is exposed, the reload happens inside the pod).
#
# The service has its own example: ../../service/ingress.example.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vectorstep-gateway
  annotations:
    # ingress-nginx: only these source ranges may connect. Replace with your
    # CI runners' egress CIDRs. Other controllers have their own equivalent.
    nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # ingressClassName: nginx
  tls:
    - hosts:
        - gateway.example.com
      secretName: vectorstep-gateway-ingress-tls
  rules:
    - host: gateway.example.com
      http:
        paths:
          # Expose only what delivery needs. /rpc (the WebSocket the service
          # uses to run agents) stays internal.
          - { path: /agents,  pathType: Prefix, backend: { service: { name: vectorstep-gateway, port: { number: 18780 } } } }
          - { path: /skills,  pathType: Prefix, backend: { service: { name: vectorstep-gateway, port: { number: 18780 } } } }
          - { path: /reload,  pathType: Exact,  backend: { service: { name: vectorstep-gateway, port: { number: 18780 } } } }
