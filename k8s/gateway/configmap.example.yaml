# EXAMPLE — copy, edit, and apply as your own ConfigMap (or generate one from
# your real config with `kubectl create configmap vectorstep-gateway-config
# --from-file=config.yaml=./my-config.yaml`). Do not apply this file verbatim.
#
# This is the same "container paths" config described in
# https://vectorstep.io/docs/operations/deployment/ — identity, agents, and skills live under /data,
# which the Deployment mounts from the PVC in pvc.yaml. The identity path
# override is not optional in a container: the default
# ~/.vectorstep-gateway/identity is ephemeral per-pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorstep-gateway-config
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 18780
      # tls:
      #   cert: /etc/vectorstep-gateway/tls/server.crt
      #   key: /etc/vectorstep-gateway/tls/server.key
      #   # key_password: ${VS_TLS_KEY_PASSWORD}
      #   # client_ca: /etc/vectorstep-gateway/tls/ca.crt   # presence enables mTLS
      # Mount path above matches the commented "tls" secret volume in
      # deployment.yaml. Enable this to give the service a verified wss://
      # hop (see ../service/configmap.example.yaml's commented executors.gateway
      # block) rather than relying on the namespace's NetworkPolicy alone.

    # Set to false when agents are assembled from a ConfigMap (delivery route C):
    # the write API (POST/PUT/DELETE /agents, /skills) then refuses with a clear
    # 403. Validate and /reload keep working. Read at startup — restart to change.
    # Default: true.
    # writes_enabled: false

    agents_dir: /data/agents
    skills_dir: /data/skills

    identity:
      path: /data/identity

    logging:
      dir: /data/logs

    # No MCP servers by default — add the ones your deployment needs (see
    # https://vectorstep.io/docs/operations/deployment/). npx-based servers fetch on first
    # startup unless preinstalled in a derived image; see https://vectorstep.io/docs/installation/docker/.
    mcp_servers: {}

    providers:
      anthropic:
        api_key: ${ANTHROPIC_API_KEY}   # from the Secret via envFrom — see README.md
