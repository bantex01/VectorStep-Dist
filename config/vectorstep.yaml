# VectorStep service configuration.
#
# Edited in place — install.sh never overwrites an existing copy of this file,
# so re-running the installer is safe.

server:
  host: 0.0.0.0
  port: 8000

database:
  # Four slashes = absolute path inside the container's /data volume.
  url: sqlite+aiosqlite:////data/db/runs.db
  # For Postgres (bring it up with `--profile postgres`):
  # url: postgresql+asyncpg://vectorstep:vectorstep@postgres:5432/vectorstep

pipeline_config_dir: /data/pipelines
step_library_dir: /data/steps

artifacts:
  dir: /data/artifacts

logging:
  dir: /data/logs

executors:
  gateway:
    url: ws://gateway:18780/rpc
    token: ${VECTORSTEP_GATEWAY_TOKEN}
    rest_url: http://gateway:18780

security:
  # A pipeline author gets a shell on this host if this is true — see the
  # config reference before enabling it.
  allow_shell_checks: false   # default: false
  template_sandbox: true      # default: true
  # executor: shell pipeline steps — see the config reference before
  # enabling. A pipeline can only reference a pre-approved script by name
  # here; scripts_dir is mounted read-only (see docker-compose.yaml) so the
  # container can't modify its own allowlist even with a compromised
  # in-process write primitive.
  shell_steps:
    enabled: false             # default: false
    scripts_dir: /etc/vectorstep/scripts
    allowed: []
    # allowed:
    #   - name: restart-service
    #     path: restart-service.sh
    #     sha256: 3f2a1c9e...       # compute with: sha256sum <file>, under ./scripts
